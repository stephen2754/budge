# Gradle daemon memory and UTF-8 encoding for build scripts.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX libraries are used throughout the project.
android.useAndroidX=true
# Kotlin official code style.
kotlin.code.style=official
# Each library module only sees its own R class (faster builds).
android.nonTransitiveRClass=true
