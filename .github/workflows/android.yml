name: Android

# The two tests that guard a release are pure JVM and cheap — the version-to-release-list
# agreement and the nine-locale parity — and before this they ran only if somebody remembered.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
